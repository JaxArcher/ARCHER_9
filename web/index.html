<!--
  ARCHER browser client — entry point.
  Served by archer/server.py at /app (assets under /static/...).
  See CONTRACT.md before changing anything here.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARCHER</title>
  <link rel="stylesheet" href="/static/css/ui.css" />
  <link rel="stylesheet" href="/static/css/orb.css" />
  <link rel="stylesheet" href="/static/css/cursor.css" />
</head>
<body>
  <div id="archer-shell">
    <div id="archer-toolbar">
      <span id="archer-status" class="status-dot" title="Connection status"></span>
      <button id="archer-mode-btn" type="button" title="Toggle whether ARCHER's brain runs LOCAL (Ollama, private, no API cost) or CLOUD (Claude/NVIDIA, smarter, needs internet)">MODE</button>
      <button id="archer-mic-btn" type="button" title="Mute/unmute your microphone -- ARCHER stops listening for the wake word or any speech while muted">MIC</button>
      <button id="archer-tts-btn" type="button" title="Mute/unmute ARCHER's spoken replies -- text replies still work while muted">SPEAKER</button>
      <button id="archer-halt-btn" type="button" title="Emergency stop -- interrupts whatever ARCHER is currently doing/saying">HALT</button>
    </div>

    <!-- Always-visible control strip for model/mic/speaker dropdowns -->
    <div id="archer-controls-bar"></div>

    <div id="archer-main-layout">
      <!-- Fixed Left Column: Chat box, Orb, Live Webcam Feed (never scrolls) -->
      <aside id="archer-left-column">
        <div id="archer-chat-column" class="archer-left-card">
          <div id="archer-live"></div>
          <div id="archer-transcript"></div>
          <form id="archer-text-form">
            <input id="archer-text-input" type="text" placeholder="Type a message..." autocomplete="off" />
            <button type="submit">Send</button>
          </form>
        </div>

        <div id="archer-orb-column" class="archer-left-card">
          <div data-archer-orb></div>
        </div>

        <div id="archer-camera-column" class="archer-left-card">
          <div class="archer-left-card-header">LIVE CAMERA</div>
          <div id="archer-left-camera-pane">
            <video id="archer-system-camera-feed" autoplay playsinline muted></video>
            <div id="archer-camera-unavailable" style="display:none;" class="archer-memory-empty">Camera unavailable</div>
            <canvas id="archer-camera-canvas" style="display:none;"></canvas>
          </div>
        </div>
      </aside>

      <!-- Right Tabbed Workspace: FILES, ARTIFACTS, TOOLS, AWAY & TASKS, SYSTEM, LOGS -->
      <main id="archer-right-column">
        <div id="archer-tabs">
          <button class="tab-btn" data-tab="files" type="button">FILES</button>
          <button class="tab-btn active" data-tab="artifacts" type="button">ARTIFACTS</button>
          <button class="tab-btn" data-tab="tools" type="button">TOOLS</button>
          <button class="tab-btn" data-tab="away_tasks" type="button">AWAY &amp; TASKS</button>
          <button class="tab-btn" data-tab="system" type="button">SYSTEM</button>
          <button class="tab-btn" data-tab="logs" type="button">LOGS</button>
          <button id="archer-cursor-toggle" type="button" aria-pressed="true">CURSOR FX: ON</button>
        </div>

        <div id="archer-tab-content">
          <!-- FILES Tab: barehands gesture file access board -->
          <div id="tab-files" class="tab-panel">
            <p id="archer-gesture-placeholder">
              barehands will connect when you open this tab (needs its own server.py running separately — see CONTRACT.md)
            </p>
          </div>

          <!-- ARTIFACTS Tab: viewer placeholder + browser mirror card -->
          <div id="tab-artifacts" class="tab-panel active">
            <div class="archer-dashboard-card archer-artifacts-placeholder">
              <h3>Artifacts &amp; Viewer</h3>
              <p class="archer-memory-hint">Objects ARCHER creates, documents, embedded browser, and interactive previews.</p>
            </div>
            <div id="tab-browser" class="archer-dashboard-card">
              <!-- js/browser.js builds live mirror of ARCHER's Playwright browser -->
            </div>
          </div>

          <!-- TOOLS Tab: list of installed skills & tools -->
          <div id="tab-tools" class="tab-panel">
            <!-- js/tools.js renders the tools & skills list -->
          </div>

          <!-- AWAY & TASKS Tab: While You Were Away interventions + Tasks & Habits -->
          <div id="tab-away_tasks" class="tab-panel">
            <div id="tab-memory" class="archer-dashboard-card">
              <!-- js/memory.js builds this: while-you-were-away -->
            </div>
            <div id="tab-tasks" class="archer-dashboard-card">
              <!-- js/tasks.js builds this: open tasks & habits -->
            </div>
          </div>

          <!-- SYSTEM Tab: GPU, VRAM, Ollama models, performance sparklines -->
          <div id="tab-system" class="tab-panel">
            <!-- js/system.js builds GPU/VRAM, Ollama loaded models, and SVG ring gauges -->
          </div>

          <!-- LOGS Tab: raw application log tail -->
          <div id="tab-logs" class="tab-panel">
            <!-- js/logs.js builds application log tail -->
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/camera.js"></script>
  <script src="/static/js/orb.js"></script>
  <script src="/static/js/ui.js"></script>
  <script src="/static/js/tabs.js"></script>
  <script src="/static/js/logs.js"></script>
  <script src="/static/js/memory.js"></script>
  <script src="/static/js/tasks.js"></script>
  <script src="/static/js/system.js"></script>
  <script src="/static/js/browser.js"></script>
  <script src="/static/js/tools.js"></script>
  <script src="/static/js/barehands.js"></script>
  <script type="module" src="/static/js/cursor.js"></script>
</body>
</html>
