<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCHER — approved artwork</title><link rel="stylesheet" href="web/css/orb.css"><style>body{margin:0;background:#03121d;color:#c3eff7;font:15px system-ui}main{max-width:850px;margin:auto}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px}button{background:#102c3b;color:#d4faff;border:1px solid #38788d;padding:10px;cursor:pointer;border-radius:6px}button[aria-pressed=true]{background:#24637b}p{padding:0 16px}label{padding:10px}</style></head><body><main><div data-archer-orb></div><nav aria-label="Preview states"><button data-state="idle">Idle</button><button data-state="listening">Listening</button><button data-state="processing">Processing</button><button data-state="speaking">Speaking</button><button data-state="halted">Halt</button><button id="reference" aria-pressed="false">Approved still</button><button id="pause" aria-pressed="false">Pause motion</button></nav><p id="status" aria-live="polite">Idle · local preview</p><p>Speaking uses simulated amplitude here. In ARCHER it uses live output amplitude. No microphone access or audio playback.</p></main><script src="web/js/orb.js"></script><script>
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{ArcherOrb.setState(b.dataset.state);document.getElementById('status').textContent=b.dataset.state+' · local preview';document.querySelectorAll('[data-state]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
for(const [id,method] of [['reference','setReference'],['pause','setPaused']])document.getElementById(id).onclick=function(){const v=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',v);ArcherOrb[method](v);};
setInterval(()=>{if(ArcherOrb.state==='speaking')ArcherOrb.setAmplitude(Math.max(0,Math.sin(performance.now()/173)*.45+Math.sin(performance.now()/71)*.25+.25));},33);
</script></body></html>
